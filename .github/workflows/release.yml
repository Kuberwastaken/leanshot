name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & package
        run: make dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/leanshot-*.zip
          generate_release_notes: true
